<body>
<h1>Profil</h1>
<div class="profil">
  <label for="name">Adınızı Girin:</label>
  <input type="text" id="name" placeholder="Adınız">
  <button onclick="kaydetAd()">Kaydet</button>
</div>
<script>
  async function kaydetAd() {
      const name = document.getElementById('name').value;
      if (name) {
          const response = await fetch('http://localhost:3000/api/profile', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name })
          });
          if (response.ok) {
              alert('Adınız kaydedildi!');
          } else {
              alert('Adınızı kaydederken bir hata oluştu.');
          }
      } else {
          alert('Lütfen adınızı girin.');
      }
  }
</script>
